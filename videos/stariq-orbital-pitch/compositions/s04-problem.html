      <div id="root" data-composition-id="s04-problem" data-width="1920" data-height="1080">
        <div class="s04" id="s04-shake">
          <!-- A · the environment -->

      <script>
        (function () {
          const T0 = 20.3;
          const tl = gsap.timeline({ paused: true });
          const at = SQ.local(T0);
          const q = (s) => document.querySelector(s);

          // ---- A: cosmic-ray streaks over the back-lit satellite ----
          tl.fromTo("#s04-bgwrap", { scale: 1.06 }, { scale: 1.0, duration: 2.9, ease: "power1.out" }, 0);
          const rays = q("#s04-rays");
          const N = 16;
          for (let i = 0; i < N; i++) {
            const r = document.createElement("div");
            r.className = "s04-ray";
            rays.appendChild(r);
            const ang = -32 + (SQ.hash(i * 17 + 3) - 0.5) * 14;
            const len = 260 + SQ.hash(i * 7 + 1) * 320;
            const y0 = -120 + SQ.hash(i * 13 + 5) * 760;
            const x0 = 300 + SQ.hash(i * 29 + 9) * 1700;
            const rad = (ang * Math.PI) / 180;
            const dist = 1500;
            const t0 = 0.05 + (i / N) * 2.3 + SQ.hash(i * 3 + 2) * 0.2;
            r.style.width = len + "px";
            tl.fromTo(
              r,
              { x: x0, y: y0, rotation: 180 + ang, opacity: 0 },
              { x: x0 - Math.cos(rad) * dist, y: y0 - Math.sin(rad) * dist, opacity: 1, duration: 0.55, ease: "none" },
              t0,
            );
            tl.to(r, { opacity: 0, duration: 0.12 }, t0 + 0.45);
          }
          tl.fromTo("#s04-alert", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, 0.15);
          tl.to("#s04-alert", { opacity: 0.55, duration: 0.18, repeat: 5, yoyo: true, ease: "none" }, 0.6);
          const wA = SQ.splitWords(q("#s04-hA"));
          tl.fromTo(wA, { opacity: 0, y: 40, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out", stagger: 0.09 }, at("vo05a", 0) - 0.05);
          tl.to(["#s04-hA", "#s04-alert"], { opacity: 0, duration: 0.3, ease: "power2.in" }, at("vo05b", 0) - 0.35);

          // ---- B: the chip, a strike, a flipped bit ----
          const tB = at("vo05b", 0) - 0.3;
          tl.fromTo("#s04-lab", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, tB);
          tl.fromTo("#s04-grid", { x: 0, y: 0 }, { x: -80, y: -40, duration: 6, ease: "none" }, tB);
          tl.fromTo("#s04-chip", { rotationX: 22, rotationY: -16, scale: 0.92, y: 40 }, { rotationX: 14, rotationY: -6, scale: 1, y: 0, duration: 4.4, ease: "power2.out" }, tB);
          const wB = SQ.splitWords(q("#s04-hB"));
          tl.fromTo(wB, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.07 }, tB + 0.25);
          tl.fromTo("#s04-bits", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, tB + 0.6);
          SQ.scramble(tl, q("#s04-bk"), tB + 0.7, 0.6, 41);
          const hit = tB + 1.85;
          tl.set("#s04-boltwrap", { rotation: 145 }, 0);
          tl.fromTo("#s04-bolt", { scaleX: 0, opacity: 1 }, { scaleX: 1, duration: 0.22, ease: "power2.in" }, hit - 0.22);
          tl.to("#s04-bolt", { opacity: 0, duration: 0.25 }, hit + 0.05);
          tl.fromTo("#s04-flash", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1.4, duration: 0.12, ease: "power2.out" }, hit);
          tl.to("#s04-flash", { opacity: 0, scale: 2.2, duration: 0.7, ease: "power2.out" }, hit + 0.12);
          tl.fromTo("#s04-ring1", { opacity: 1, scale: 0.2 }, { opacity: 0, scale: 3.2, duration: 0.9, ease: "power2.out" }, hit);
          tl.fromTo("#s04-ring2", { opacity: 1, scale: 0.2 }, { opacity: 0, scale: 4.6, duration: 1.2, ease: "power2.out" }, hit + 0.12);
          tl.fromTo("#s04-chip", { x: 0 }, { keyframes: [{ x: -14 }, { x: 11 }, { x: -7 }, { x: 4 }, { x: 0 }], duration: 0.35, ease: "none" }, hit);
          tl.fromTo("#s04-v1", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(3)" }, hit + 0.08);
          tl.to("#s04-v0", { opacity: 0, duration: 0.1 }, hit + 0.08);
          tl.fromTo("#s04-seu", { opacity: 0 }, { opacity: 1, duration: 0.2 }, hit + 0.2);
          tl.to("#s04-seu", { opacity: 0.4, duration: 0.15, yoyo: true, repeat: 5, ease: "none" }, hit + 0.45);

          // ---- C: "Linux can crash." ----
          const tC = at("vo05c", 0);
          tl.to("#s04-lab", { opacity: 0.18, duration: 0.15 }, tC - 0.1);
          tl.to(["#s04-hB", "#s04-bits"], { opacity: 0, duration: 0.12, ease: "none" }, tC - 0.12);
          tl.fromTo("#s04-hC", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.25, ease: "expo.out" }, tC - 0.05);
          tl.fromTo("#s04-term", { opacity: 0, scale: 0.94, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.2, ease: "expo.out" }, tC - 0.1);
          tl.fromTo("#s04-term .s04-tl", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.08, stagger: 0.17, ease: "none" }, tC);
          tl.fromTo("#s04-shake", { x: 0, y: 0 }, { keyframes: [{ x: -16, y: 6 }, { x: 13, y: -8 }, { x: -9, y: 4 }, { x: 6, y: -2 }, { x: 0, y: 0 }], duration: 0.4, ease: "none" }, tC + 0.68);
          tl.to(["#s04-hC", "#s04-term"], { opacity: 0, duration: 0.25, ease: "power2.in" }, at("vo05d", 0) - 0.3);
          tl.to("#s04-lab", { opacity: 0.0, duration: 0.3 }, at("vo05d", 0) - 0.3);

          // ---- D: "Or worse, the system keeps running, while its answer is silently wrong." ----
          const tD = at("vo05d", 0);
          tl.fromTo("#s04-dash", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, tD);
          tl.fromTo("#s04-ekg", { strokeDasharray: "1400", strokeDashoffset: 1400 }, { strokeDashoffset: 0, duration: 1.6, ease: "none" }, tD + 0.3);
          tl.fromTo("#s04-hD", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, at("vo05d", 2) + 0.2);
          tl.fromTo("#s04-stamp", { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, at("vo05d", 2) + 0.9);
          tl.fromTo("#s04-res", { x: 0, color: "#eef4ff" }, { keyframes: [{ x: 8, color: "#f3ac3d" }, { x: -6 }, { x: 4 }, { x: 0 }], duration: 0.3, ease: "none" }, at("vo05d", 2) + 0.85);
          tl.to("#s04-shake", { opacity: 0, duration: 0.35, ease: "power2.in" }, 12.25);

          window.__timelines["s04-problem"] = tl;
        })();
      </script>
