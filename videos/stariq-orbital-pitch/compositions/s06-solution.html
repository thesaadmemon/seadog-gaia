<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/css/brand.css" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: radial-gradient(ellipse at 72% 48%, #0e2557 0%, #061230 42%, #030814 100%);
        }
        .s06 {
          position: absolute;
          inset: 0;
        }
        .s06-stars {
          position: absolute;
          inset: 0;
        }
        .s06-star {
          position: absolute;
          width: 3px;
          height: 3px;
          border-radius: 50%;
          background: #dce8ff;
        }
        .s06-satzone {
          position: absolute;
          left: 920px;
          top: 120px;
          width: 940px;
          height: 840px;
        }
        .s06-shield {
          position: absolute;
          left: 50px;
          top: 0;
          width: 840px;
          height: 840px;
        }
        .s06-sat {
          position: absolute;
          left: 30px;
          top: 210px;
          width: 880px;
          height: 455px;
        }
        .s06-sat img {
          width: 100%;
          height: 100%;
          display: block;
          filter: drop-shadow(0 30px 50px rgba(0, 0, 0, 0.55));
        }
        .s06-left {
          position: absolute;
          left: 120px;
          top: 170px;
          width: 800px;
          display: flex;
          flex-direction: column;
          gap: 24px;
        }
        .s06-h1 {
          font-size: 84px;
        }
        .s06-layers {
          display: flex;
          flex-direction: column;
          gap: 18px;
          margin-top: 10px;
        }
        .s06-layer {
          display: grid;
          grid-template-columns: 70px 1fr;
          gap: 22px;
          align-items: center;
          padding: 20px 26px;
          border-left-width: 6px;
        }
        .s06-layer .ic {
          width: 70px;
          height: 70px;
          display: flex;
          align-items: center;
          justify-content: center;
          border-radius: 12px;
          font-family: "JetBrains Mono", monospace;
          font-weight: 700;
          font-size: 34px;
        }
        .s06-layer .ic img {
          width: 46px;
          height: auto;
        }
        .s06-layer .nm {
          font-family: "Manrope", sans-serif;
          font-weight: 800;
          font-size: 38px;
          color: #eef4ff;
        }
        .s06-layer .ds {
          font-family: "Manrope", sans-serif;
          font-size: 25px;
          color: #a9bddc;
          margin-top: 4px;
        }
        .s06-l1 {
          border-color: #4a86ff;
        }
        .s06-l1 .ic {
          background: rgba(74, 134, 255, 0.16);
        }
        .s06-l2 {
          border-color: #22c7ae;
        }
        .s06-l2 .ic {
          background: rgba(34, 199, 174, 0.16);
          color: #22c7ae;
        }
        .s06-l3 {
          border-color: #f3ac3d;
        }
        .s06-l3 .ic {
          background: rgba(243, 172, 61, 0.16);
          color: #f3ac3d;
        }
        /* recovery loop */
        .s06-loop {
          position: absolute;
          left: 90px;
          top: 230px;
          width: 820px;
          height: 720px;
          opacity: 0;
        }
        .s06-loop svg {
          position: absolute;
          left: 0;
          top: 0;
          width: 820px;
          height: 720px;
        }
        .s06-node {
          position: absolute;
          width: 250px;
          margin-left: -125px;
          margin-top: -50px;
          padding: 14px 18px;
          text-align: center;
          font-family: "JetBrains Mono", monospace;
          font-weight: 700;
          font-size: 22px;
          letter-spacing: 0.14em;
          color: #a9bddc;
        }
        .s06-node b {
          display: block;
          font-family: "Manrope", sans-serif;
          font-size: 30px;
          letter-spacing: 0;
          color: #eef4ff;
          margin-top: 2px;
        }
        .s06-center {
          position: absolute;
          left: 410px;
          top: 360px;
          width: 240px;
          margin-left: -120px;
          margin-top: -44px;
          text-align: center;
          font-family: "Orbitron", sans-serif;
          font-weight: 900;
          font-size: 32px;
          letter-spacing: 0.08em;
          color: #eef4ff;
          line-height: 1.3;
        }
        .s06-center small {
          display: block;
          font-family: "JetBrains Mono", monospace;
          font-weight: 400;
          font-size: 16px;
          letter-spacing: 0.12em;
          color: #5fd8ff;
          margin-top: 10px;
        }
        .s06-ground {
          position: absolute;
          left: 120px;
          bottom: 108px;
          display: flex;
          align-items: center;
          gap: 16px;
          padding: 14px 24px;
          font-family: "JetBrains Mono", monospace;
          font-weight: 700;
          font-size: 22px;
          letter-spacing: 0.16em;
          color: #22c7ae;
          border-color: rgba(34, 199, 174, 0.6);
          opacity: 0;
        }
        .s06-target {
          position: absolute;
          right: 120px;
          bottom: 108px;
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="s06-solution" data-width="1920" data-height="1080">
        <div class="s06">
          <div class="s06-stars" id="s06-stars"></div>
          <div class="s06-satzone" id="s06-satzone">
            <svg class="s06-shield" id="s06-shield" viewBox="0 0 840 840">
              <defs>
                <radialGradient id="s06-sg" cx="50%" cy="50%" r="50%">
                  <stop offset="0.72" stop-color="#4a86ff" stop-opacity="0" />
                  <stop offset="0.97" stop-color="#4a86ff" stop-opacity="0.32" />
                  <stop offset="1" stop-color="#9cc0ff" stop-opacity="0.7" />
                </radialGradient>
                <pattern id="s06-hex" width="42" height="72.7" patternUnits="userSpaceOnUse" patternTransform="scale(1.1)">
                  <path d="M21 0 L42 12.1 L42 36.4 L21 48.5 L0 36.4 L0 12.1 Z M21 48.5 L21 72.7" fill="none" stroke="#7fb0ff" stroke-width="1.6" stroke-opacity="0.38" />
                </pattern>
                <clipPath id="s06-clip"><circle cx="420" cy="420" r="400" /></clipPath>
              </defs>
              <g id="s06-shield-body">
                <circle cx="420" cy="420" r="400" fill="url(#s06-sg)" />
                <rect x="0" y="0" width="840" height="840" fill="url(#s06-hex)" clip-path="url(#s06-clip)" />
                <circle id="s06-ring" cx="420" cy="420" r="408" fill="none" stroke="#5fd8ff" stroke-width="3" stroke-dasharray="18 14" />
              </g>
            </svg>
            <div class="s06-sat" id="s06-sat"><img src="assets/img/sat-ai-concept.png" alt="STARIQ AI satellite concept" /></div>
          </div>

          <div class="s06-left" id="s06-left">
            <div class="kicker" id="s06-kicker" data-text="THE SOLUTION">THE SOLUTION</div>
            <h1 class="headline s06-h1" id="s06-h1">One platform. <span class="accent">Three layers.</span></h1>
            <div class="s06-layers">
              <div class="s06-layer panel s06-l1" id="s06-l1">
                <div class="ic"><img src="assets/img/tux.png" alt="Linux" /></div>
                <div><div class="nm">Hardened Linux</div><div class="ds">Keeps essential software available.</div></div>
              </div>
              <div class="s06-layer panel s06-l2" id="s06-l2">
                <div class="ic">AI</div>
                <div><div class="nm">AI protection</div><div class="ds">Detects computation faults.</div></div>
              </div>
              <div class="s06-layer panel s06-l3" id="s06-l3">
                <div class="ic">↻</div>
                <div><div class="nm">Automatic recovery</div><div class="ds">Restores the workload on board.</div></div>
              </div>
            </div>
          </div>

          <div class="s06-loop" id="s06-loop">
            <svg viewBox="0 0 820 720">
              <circle cx="410" cy="360" r="250" fill="none" stroke="rgba(120,170,255,0.22)" stroke-width="3" />
              <circle id="s06-arc" cx="410" cy="360" r="250" fill="none" stroke="#5fd8ff" stroke-width="5" stroke-linecap="round" transform="rotate(-90 410 360)" stroke-dasharray="1571" stroke-dashoffset="1571" />
              <circle id="s06-comet" cx="410" cy="110" r="13" fill="#eef4ff" />
            </svg>
            <div class="s06-node panel" id="s06-n1" style="left: 410px; top: 100px">01 · LINUX<b>Kept alive</b></div>
            <div class="s06-node panel" id="s06-n2" style="left: 700px; top: 370px">02 · DETECT<b>Corrupted result</b></div>
            <div class="s06-node panel" id="s06-n3" style="left: 410px; top: 640px">03 · RESTORE<b>The AI workload</b></div>
            <div class="s06-node panel" id="s06-n4" style="left: 120px; top: 370px">04 · RECOVER<b>On its own</b></div>
            <div class="s06-center" id="s06-center">STARIQ<small>RECOVERY LOOP</small></div>
          </div>
          <div class="s06-ground panel" id="s06-ground">● NO OPERATOR ON EARTH REQUIRED</div>
          <div class="srcnote s06-target" id="s06-target">TARGET: RESUME A USEFUL, RELIABLE AI SERVICE · INTEGRATED PERFORMANCE TO BE QUALIFIED</div>
        </div>
      </div>

      <script>
        (function () {
          const T0 = 49.7;
          const tl = gsap.timeline({ paused: true });
          const at = SQ.local(T0);
          const q = (s) => document.querySelector(s);

          // seeded star field with slow parallax
          const stars = q("#s06-stars");
          for (let i = 0; i < 140; i++) {
            const s = document.createElement("div");
            s.className = "s06-star";
            s.style.left = Math.floor(SQ.hash(i * 11 + 1) * 1920) + "px";
            s.style.top = Math.floor(SQ.hash(i * 11 + 2) * 1080) + "px";
            s.style.opacity = (0.25 + SQ.hash(i * 11 + 3) * 0.6).toFixed(2);
            const sz = 1 + Math.floor(SQ.hash(i * 11 + 4) * 3);
            s.style.width = s.style.height = sz + "px";
            stars.appendChild(s);
          }
          tl.fromTo("#s06-stars", { x: 0 }, { x: -70, duration: 16.3, ease: "none" }, 0);

          // the photoreal satellite floats; the shield wraps it on "in one platform"
          tl.fromTo("#s06-sat", { x: 120, opacity: 0, rotation: -4 }, { x: 0, opacity: 1, rotation: 0, duration: 1.4, ease: "power3.out" }, 0.05);
          tl.fromTo("#s06-sat", { y: 0 }, { y: -26, duration: 2.6, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false }, 1.4);
          tl.fromTo("#s06-satzone", { rotationY: -10, transformPerspective: 1800 }, { rotationY: 8, transformPerspective: 1800, duration: 16.3, ease: "none" }, 0);
          tl.fromTo("#s06-shield", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.9, ease: "expo.out", transformOrigin: "50% 50%" }, at("vo08", 3) - 0.1);
          tl.fromTo("#s06-ring", { rotation: 0, svgOrigin: "420 420" }, { rotation: 120, svgOrigin: "420 420", duration: 11, ease: "none" }, at("vo08", 3));

          // "Star eye-cue combines hardened Linux, / AI protection, / and automatic recovery, / in one platform."
          SQ.scramble(tl, q("#s06-kicker"), 0.1, 0.6, 61);
          const wh = SQ.splitWords(q("#s06-h1"));
          tl.fromTo(wh, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.08 }, at("vo08", 0));
          tl.fromTo("#s06-l1", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, at("vo08", 0) + 1.2);
          tl.fromTo("#s06-l2", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, at("vo08", 1) - 0.05);
          tl.fromTo("#s06-l3", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, at("vo08", 2) + 0.2);

          // recovery loop: the comet reaches each node on its phrase
          const tL = at("vo09", 0);
          tl.to("#s06-left", { opacity: 0, x: -40, duration: 0.4, ease: "power2.in" }, tL - 0.4);
          tl.fromTo("#s06-loop", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, tL - 0.1);
          const comet = q("#s06-comet");
          const arc = q("#s06-arc");
          const loop = { a: 0 };
          const draw = () => {
            const a = loop.a;
            comet.setAttribute("cx", 410 + Math.sin(a * Math.PI * 2) * 250);
            comet.setAttribute("cy", 360 - Math.cos(a * Math.PI * 2) * 250);
            arc.setAttribute("stroke-dashoffset", String(1571 * (1 - Math.min(1, a))));
          };
          draw();
          const keys = [
            [at("vo09", 0), 0.0],
            [at("vo09", 1), 0.25],
            [at("vo09", 2), 0.5],
            [at("vo09", 3), 0.75],
            [at("vo09", 4), 1.0],
          ];
          for (let i = 0; i < keys.length - 1; i++) {
            tl.fromTo(loop, { a: keys[i][1] }, { a: keys[i + 1][1], duration: keys[i + 1][0] - keys[i][0], ease: "power2.inOut", onUpdate: draw }, keys[i][0]);
          }
          ["#s06-n1", "#s06-n2", "#s06-n3", "#s06-n4"].forEach((n, i) => {
            tl.fromTo(n, { opacity: 0.25, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, keys[i][0] + (i === 0 ? 0.1 : -0.05));
            tl.fromTo(n, { borderColor: "rgba(95,160,255,0.42)" }, { borderColor: "#5fd8ff", duration: 0.3 }, keys[i][0]);
          });
          tl.fromTo("#s06-center", { opacity: 0 }, { opacity: 1, duration: 0.5 }, tL + 0.2);
          tl.fromTo("#s06-shield-body", { opacity: 1 }, { opacity: 0.55, duration: 0.18, yoyo: true, repeat: 1, ease: "none" }, keys[1][0]);
          tl.fromTo("#s06-shield-body", { opacity: 1 }, { opacity: 0.55, duration: 0.18, yoyo: true, repeat: 1, ease: "none" }, keys[2][0]);
          // "with no operator on Earth."
          tl.fromTo("#s06-ground", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, at("vo09", 4) - 0.05);
          tl.fromTo("#s06-target", { opacity: 0 }, { opacity: 1, duration: 0.6 }, at("vo09", 4) + 0.4);

          tl.to(".s06", { opacity: 0, duration: 0.3, ease: "power2.in" }, 16.0);

          window.__timelines["s06-solution"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
