          bottom: 104px;

      <div id="root" data-composition-id="s09-team" data-width="1920" data-height="1080">
        <div class="s09">
          <div class="s09-bgwrap" id="s09-bgwrap">
            <video id="s09-bg" src="assets/broll/orbital.mp4" muted playsinline data-start="0" data-duration="10.4" data-media-start="58" data-track-index="0"></video>

          <div class="scene-shade s09-shade"></div>

          <div class="kicker s09-kicker" id="s09-kicker" data-text="THE TEAM">THE TEAM</div>
          <div class="s09-founder">
            <div class="s09-portrait" id="s09-portrait">

                <circle id="s09-r2" cx="165" cy="165" r="146" fill="none" stroke="rgba(74,134,255,0.6)" stroke-width="2" stroke-dasharray="4 10" />
              </svg>
              <img src="assets/img/founder.jpg" alt="Dr. Md Saad Memon" />
            </div>
            <div>
              <h1 class="headline s09-name" id="s09-name">Dr. Md Saad Memon</h1>
              <div class="s09-role" id="s09-role" data-text="FOUNDER &amp; CEO">FOUNDER &amp; CEO</div>
              <div class="s09-phd" id="s09-phd">PhD in radiation-resilient computing. Satellite computing architect.</div>
            </div>
          </div>
          <div class="s09-creds" id="s09-creds">
            <div class="s09-cred">2 RADIATION CAMPAIGNS</div>
            <div class="s09-cred">FLIGHT HERITAGE</div>

            <div class="s09-cred gold">BEST ENTREPRENEUR 2026</div>
          </div>

          <div class="s09-co" id="s09-co">
            <div class="s09-cocard panel" id="s09-co1">
              <div class="lg"><img src="assets/img/nasa-meatball.png" alt="NASA" /></div>
              <div><div class="t">CO-FOUNDER · NASA</div><div class="d">NASA &amp; US space-industry network</div></div>
            </div>
            <div class="s09-cocard panel" id="s09-co2">
              <div class="lg esa"><img src="assets/img/esa-logo.svg" alt="European Space Agency" /></div>
              <div><div class="t">CO-FOUNDER · ESA</div><div class="d">ESA &amp; European space network</div></div>

      <script>
        (function () {
          const T0 = 95.9;
          const tl = gsap.timeline({ paused: true });
          const at = SQ.local(T0);
          const q = (s) => document.querySelector(s);

          tl.fromTo("#s09-bgwrap", { scale: 1.08 }, { scale: 1.0, duration: 10.4, ease: "none" }, 0);
          SQ.scramble(tl, q("#s09-kicker"), 0.05, 0.5, 91);

          // "Star eye-cue is led by Doctor Saad Memon,"
          tl.fromTo("#s09-portrait", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.7, ease: "expo.out" }, at("vo13", 0) + 0.1);
          tl.fromTo("#s09-r1", { rotation: 0, svgOrigin: "165 165" }, { rotation: 140, svgOrigin: "165 165", duration: 10, ease: "none" }, 0);
          tl.fromTo("#s09-r2", { rotation: 0, svgOrigin: "165 165" }, { rotation: -90, svgOrigin: "165 165", duration: 10, ease: "none" }, 0);
          const wn = SQ.splitWords(q("#s09-name"));
          tl.fromTo(wn, { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.1 }, at("vo13", 0) + 1.0);
          SQ.scramble(tl, q("#s09-role"), at("vo13", 0) + 1.5, 0.6, 92);

          // "a PhD in radiation-resilient computing,"
          tl.fromTo("#s09-phd", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, at("vo13", 1) - 0.05);
          tl.fromTo("#s09-creds .s09-cred", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(2)", stagger: 0.22 }, at("vo13", 1) + 0.9);

          // "with co-founders from NASA and the European Space Agency."
          tl.fromTo("#s09-co1", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, at("vo13", 2) + 1.0);
          tl.fromTo("#s09-co2", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, at("vo13", 2) + 1.9);
          tl.fromTo("#s09-note", { opacity: 0 }, { opacity: 1, duration: 0.6 }, at("vo13", 2) + 2.4);

          tl.to(".s09", { opacity: 0, duration: 0.3, ease: "power2.in" }, 10.1);

          window.__timelines["s09-team"] = tl;
        })();
      </script>
