<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/css/brand.css" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #02050d;
        }
        .s11 {
          position: absolute;
          inset: 0;
        }
        .s11-bgwrap {
          position: absolute;
          inset: 0;
        }
        .s11-bgwrap video {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
        }
        .s11-shade {
          background: radial-gradient(ellipse at 50% 40%, rgba(2, 5, 13, 0.6) 0%, rgba(2, 5, 13, 0.15) 60%);
        }
        .s11-lockup {
          position: absolute;
          left: 0;
          right: 0;
          top: 250px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 30px;
        }
        .s11-word {
          font-family: "Orbitron", sans-serif;
          font-weight: 900;
          font-size: 190px;
          line-height: 1;
          letter-spacing: 0.1em;
          color: #f4f8ff;
          text-shadow: 0 0 50px rgba(120, 170, 255, 0.45);
          padding-left: 0.1em;
        }
        .s11-word .iq {
          color: #4a86ff;
          text-shadow: 0 0 60px rgba(74, 134, 255, 0.8);
        }
        .s11-tag {
          font-family: "Manrope", sans-serif;
          font-weight: 800;
          font-size: 64px;
          color: #eef4ff;
          letter-spacing: -0.01em;
        }
        .s11-tag .accent {
          text-shadow: 0 0 30px rgba(74, 134, 255, 0.6);
        }
        .s11-contact {
          display: flex;
          gap: 40px;
          align-items: center;
          font-family: "JetBrains Mono", monospace;
          font-weight: 700;
          font-size: 28px;
          letter-spacing: 0.12em;
          color: #5fd8ff;
          margin-top: 10px;
        }
        .s11-contact .sep {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: #4a86ff;
        }
        .s11-foot {
          font-family: "JetBrains Mono", monospace;
          font-size: 20px;
          letter-spacing: 0.3em;
          color: #a9bddc;
        }
      </style>

      <div id="root" data-composition-id="s11-close" data-width="1920" data-height="1080">
        <div class="s11">
          <div class="s11-bgwrap" id="s11-bgwrap">
            <video id="s11-bg" src="assets/broll/orbital.mp4" muted playsinline data-start="0" data-duration="6.85" data-media-start="86" data-track-index="0"></video>
          </div>
          <div class="scene-shade s11-shade"></div>
          <div class="s11-lockup" id="s11-lockup">
            <div class="s11-word" id="s11-word"><span id="s11-star">STAR</span><span class="iq" id="s11-iq">IQ</span></div>
            <div class="s11-tag" id="s11-tag">Powerful AI. <span class="accent">Built for space.</span></div>
            <div class="s11-contact" id="s11-contact"><span>www.aisat.net</span><span class="sep"></span><span>mail.saadmemon@gmail.com</span></div>
            <div class="s11-foot" id="s11-foot">LUXEMBOURG · SEED ROUND OPEN · OCTOBER 2026</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const T0 = 117.75;
          const tl = gsap.timeline({ paused: true });
          const at = SQ.local(T0);
          const q = (s) => document.querySelector(s);

          tl.fromTo("#s11-bgwrap", { scale: 1.12 }, { scale: 1.0, duration: 6.85, ease: "power1.out" }, 0);

          // "Star eye-cue."
          const chars = SQ.splitChars(q("#s11-star")).concat(SQ.splitChars(q("#s11-iq")));
          tl.fromTo(
            chars,
            { opacity: 0, y: 60, rotationX: -80, transformPerspective: 800 },
            { opacity: 1, y: 0, rotationX: 0, transformPerspective: 800, duration: 0.7, ease: "expo.out", stagger: 0.06 },
            at("vo15", 0) - 0.25,
          );
          // "Powerful AI, / built for space."
          const wt = SQ.splitWords(q("#s11-tag"));
          tl.fromTo(wt.slice(0, 2), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.1 }, at("vo15", 1) - 0.05);
          tl.fromTo(wt.slice(2), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.1 }, at("vo15", 2) - 0.05);
          tl.fromTo("#s11-contact", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, at("vo15", "end") + 0.2);
          tl.fromTo("#s11-foot", { opacity: 0 }, { opacity: 1, duration: 0.6 }, at("vo15", "end") + 0.6);

          window.__timelines["s11-close"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
