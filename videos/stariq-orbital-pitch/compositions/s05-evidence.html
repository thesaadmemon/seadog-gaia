  <body>
    <template>
      <link rel="stylesheet" href="assets/css/brand.css" />
      <style>
        #root {
          position: absolute;

          background: #030814;
        }
        .s05 {

        .s05-grid {

          background-size: 96px 96px;
        }
        .s05-col {

        }

          display: flex;

        }
        .s05-badge {
          display: flex;

        }
        .s05-badge img {

          display: block;
        }
        .s05-badge .t {
          font-family: "Manrope", sans-serif;
          font-weight: 800;

        .s05-badge .t small {

        .s05-ieee {

        .s05-h2 {

        .s05-cards {

        .s05-card {
          padding: 24px 24px 22px;
          display: flex;

        }
        .s05-chipico {
          width: 86px;
          height: 86px;
          border-radius: 10px;
          border: 3px solid #4a86ff;

          position: relative;
        }
        .s05-card.new .s05-chipico {
          border-color: #22c7ae;

        }
        .s05-card .nm {
          font-family: "Manrope", sans-serif;

        }
        .s05-card .ds {
          font-family: "JetBrains Mono", monospace;
          font-size: 19px;
          letter-spacing: 0.12em;
          color: #a9bddc;
        }
        .s05-scan {
          position: absolute;
          top: 0;
          bottom: 0;
          left: 0;
          width: 70px;
          background: linear-gradient(90deg, rgba(243, 172, 61, 0), rgba(243, 172, 61, 0.35), rgba(243, 172, 61, 0));
        }
        /* chart */
        .s05-chart {
          position: absolute;
          left: 120px;
          top: 300px;
          width: 1360px;
          padding: 40px 46px 34px;
          display: flex;
          flex-direction: column;
          gap: 30px;
          opacity: 0;
        }
        .s05-chart .ttl {
          font-family: "Manrope", sans-serif;
          font-weight: 800;
          font-size: 40px;
          color: #eef4ff;
        }
        .s05-chart .ttl small {
          font-family: "JetBrains Mono", monospace;
          font-weight: 400;
          font-size: 20px;
          letter-spacing: 0.14em;
          color: #a9bddc;
          margin-left: 18px;
        }
        .s05-bar {
          display: grid;
          grid-template-columns: 330px 1fr 210px;
          align-items: center;
          gap: 24px;
        }
        .s05-bar .lb {
          font-family: "JetBrains Mono", monospace;
          font-size: 22px;
          letter-spacing: 0.1em;
          color: #c9d6ea;
        }
        .s05-track {
          height: 52px;
          position: relative;
        }
        .s05-fill {
          position: absolute;
          left: 0;
          top: 0;
          height: 100%;
          transform-origin: 0 50%;
          background: #4a86ff;
        }
        .s05-fill.hatch {
          background: repeating-linear-gradient(135deg, rgba(34, 199, 174, 0.85) 0 10px, rgba(34, 199, 174, 0.25) 10px 20px);
        }
        .s05-fill.solid-new {
          background: #22c7ae;
          box-shadow: 0 0 30px rgba(34, 199, 174, 0.5);
        }
        .s05-val {
          font-family: "Orbitron", sans-serif;
          font-weight: 900;
          font-size: 40px;
          color: #eef4ff;
          text-align: right;
        }
        .s05-val.big {
          font-size: 54px;
          white-space: nowrap;
          color: #22c7ae;
        }
        .s05-take {
          position: absolute;
          left: 120px;
          top: 830px;
          font-family: "Manrope", sans-serif;
          font-weight: 800;
          font-size: 50px;
          color: #eef4ff;
          opacity: 0;
        }
        .s05-take span {
          color: #22c7ae;
        }
        .s05-note {
          position: absolute;
          left: 120px;
          bottom: 104px;
          width: 1500px;
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="s05-evidence" data-width="1920" data-height="1080">
        <div class="s05">
          <div class="s05-earth" id="s05-earth"><img src="assets/img/apollo-earth.jpg" alt="Earth photographed by NASA Apollo astronauts" /></div>
          <div class="scene-shade s05-shade"></div>
          <div class="s05-grid" id="s05-grid"></div>

          <div class="s05-col" id="s05-col">
            <div class="kicker" id="s05-kicker" data-text="THE EVIDENCE · PEER-REVIEWED">THE EVIDENCE · PEER-REVIEWED</div>
            <h1 class="headline s05-h1" id="s05-h1">Our research.</h1>
            <div class="s05-pub">
              <div class="s05-ieee panel" id="s05-ieee">IEEE</div>
              <div class="s05-badge panel" id="s05-nasa">
                <img src="assets/img/nasa-meatball.png" alt="NASA" />
                <div class="t">On NASA’s website<small>NTRS · 20250004489</small></div>
              </div>
            </div>
            <p class="headline s05-h2" id="s05-h2">The first comparison of radiation-sensitive Linux components across three commercial chip platforms.</p>
            <div class="s05-cards">
              <div class="s05-card panel" id="s05-c1"><div class="s05-chipico"></div><div class="nm">Platform A</div><div class="ds">OLDER · LINUX</div><div class="s05-scan"></div></div>
              <div class="s05-card panel" id="s05-c2"><div class="s05-chipico"></div><div class="nm">Platform B</div><div class="ds">OLDER · LINUX</div><div class="s05-scan"></div></div>
              <div class="s05-card panel new" id="s05-c3"><div class="s05-chipico"></div><div class="nm">Newer NXP</div><div class="ds">NEWER · LINUX</div><div class="s05-scan"></div></div>
            </div>
          </div>

          <div class="s05-chart panel" id="s05-chart">
            <div class="ttl">Linux uptime under radiation<small>RELATIVE · REFERENCE = 1×</small></div>
            <div class="s05-bar"><div class="lb">OLDER PLATFORM A</div><div class="s05-track"><div class="s05-fill" id="s05-f1" style="width: 30%"></div></div><div class="s05-val">1×</div></div>
            <div class="s05-bar"><div class="lb">OLDER PLATFORM B</div><div class="s05-track"><div class="s05-fill" id="s05-f2" style="width: 30%"></div></div><div class="s05-val">1×</div></div>
            <div class="s05-bar">
              <div class="lb">NEWER NXP PLATFORM</div>
              <div class="s05-track"><div class="s05-fill hatch" id="s05-f3h" style="width: 90%"></div><div class="s05-fill solid-new" id="s05-f3" style="width: 60%"></div></div>
              <div class="s05-val big" id="s05-v3">2–3×</div>
            </div>
          </div>
          <div class="s05-take" id="s05-take">That evidence shows us <span>which software to protect.</span></div>
          <div class="srcnote s05-note" id="s05-note">RESEARCH RESULT, NOT A PRODUCT BENCHMARK · UPTIME = TIME LINUX RUNS BEFORE INTERRUPTION · [1] NASA NTRS / IEEE</div>
        </div>
      </div>

      <script>
        (function () {
          const T0 = 32.9;
          const tl = gsap.timeline({ paused: true });
          const at = SQ.local(T0);
          const q = (s) => document.querySelector(s);

          // real photograph drifting behind the evidence
          tl.fromTo("#s05-earth", { scale: 1.0, rotation: -4, x: 60 }, { scale: 1.08, rotation: 2, x: 0, duration: 16.8, ease: "none" }, 0);
          tl.fromTo("#s05-grid", { y: 0 }, { y: -96, duration: 16.8, ease: "none" }, 0);

          SQ.scramble(tl, q("#s05-kicker"), 0.1, 0.8, 51);
          const w1 = SQ.splitWords(q("#s05-h1"));
          tl.fromTo(w1, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.1 }, at("vo06", 0) - 0.05);
          // "published in I triple E and on NASA's website"
          tl.fromTo("#s05-ieee", { opacity: 0, y: 30, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, at("vo06", 1) + 0.45);
          tl.fromTo("#s05-nasa", { opacity: 0, y: 30, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, at("vo06", 1) + 1.15);
          // "is the first comparison ... across three commercial chip platforms."
          const w2 = SQ.splitWords(q("#s05-h2"));
          tl.fromTo(w2, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", stagger: 0.07 }, at("vo06", 2) - 0.05);
          ["#s05-c1", "#s05-c2", "#s05-c3"].forEach((c, i) => {
            tl.fromTo(c, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, at("vo06", 2) + 3.6 + i * 0.32);
            tl.fromTo(c + " .s05-scan", { x: -80 }, { x: 420, duration: 1.1, ease: "none", repeat: 2 }, at("vo06", 2) + 3.9 + i * 0.32);
          });

          // "The newest platform ran two to three times longer."
          const tC = at("vo07", 0);
          tl.to("#s05-col", { opacity: 0, y: -40, duration: 0.4, ease: "power2.in" }, tC - 0.45);
          tl.fromTo("#s05-chart", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, tC - 0.1);
          tl.fromTo(["#s05-f1", "#s05-f2"], { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out", stagger: 0.12 }, tC + 0.3);
          tl.fromTo("#s05-f3", { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "power3.out" }, tC + 0.8);
          tl.fromTo("#s05-f3h", { scaleX: 0 }, { scaleX: 1, duration: 1.3, ease: "power3.out" }, tC + 1.0);
          tl.fromTo("#s05-v3", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, tC + 1.2);
          tl.fromTo("#s05-note", { opacity: 0 }, { opacity: 1, duration: 0.6 }, tC + 1.6);

          // "That evidence shows us which software to protect."
          tl.fromTo("#s05-take", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, at("vo07", 1) - 0.05);

          tl.to(["#s05-chart", "#s05-take", "#s05-note"], { opacity: 0, duration: 0.35, ease: "power2.in" }, 16.4);

          window.__timelines["s05-evidence"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
