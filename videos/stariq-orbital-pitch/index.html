      <audio id="sfx-trillion" src="assets/audio/sfx/ping.mp3" data-start="81.9" data-duration="1.32" data-track-index="22" data-volume="0.42" data-audio-group="sfx"></audio>
      <audio id="sfx-cut-business" src="assets/audio/sfx/whoosh.mp3" data-start="83.44" data-duration="0.575" data-track-index="22" data-volume="0.28" data-audio-group="sfx"></audio>
      <audio id="sfx-market-1" src="assets/audio/sfx/sparkle.mp3" data-start="91.07" data-duration="1.802" data-track-index="22" data-volume="0.22" data-audio-group="sfx"></audio>
      <audio id="sfx-market-2" src="assets/audio/sfx/sparkle.mp3" data-start="93.0" data-duration="1.802" data-track-index="22" data-volume="0.22" data-audio-group="sfx"></audio>
      <audio id="sfx-market-3" src="assets/audio/sfx/sparkle.mp3" data-start="94.3" data-duration="1.802" data-track-index="23" data-volume="0.22" data-audio-group="sfx"></audio>
      <audio id="sfx-cut-team" src="assets/audio/sfx/whoosh-short.mp3" data-start="95.74" data-duration="0.575" data-track-index="22" data-volume="0.24" data-audio-group="sfx"></audio>
      <audio id="sfx-cut-ask" src="assets/audio/sfx/whoosh-short.mp3" data-start="106.14" data-duration="0.575" data-track-index="22" data-volume="0.28" data-audio-group="sfx"></audio>

      <audio id="sfx-close-whoosh" src="assets/audio/sfx/whoosh-cinematic.mp3" data-start="115.21" data-duration="5.544" data-track-index="22" data-volume="0.24" data-audio-group="sfx"></audio>
      <audio id="sfx-close-hit" src="assets/audio/sfx/impact-bass-1.mp3" data-start="117.96" data-duration="2.116" data-track-index="23" data-volume="0.4" data-audio-group="sfx"></audio>
    </div>

    <script>
      const TOTAL = 124.6;
      const tl = gsap.timeline({ paused: true });

      // HUD presence: on during the story, off for the title card and the closing frame.
      tl.fromTo("#hud-in", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.out" }, 0.8);
      tl.to("#hud-in", { opacity: 0, duration: 0.35, ease: "power2.in" }, 9.75);
      tl.to("#hud-in", { opacity: 1, duration: 0.6, ease: "power2.out" }, 13.1);
      tl.to("#hud-in", { opacity: 0, duration: 0.6, ease: "power2.in" }, 117.4);

      // Mission clock + telemetry, derived from timeline time only.
      const clock = { t: 0 };
      const elT = document.getElementById("hud-time");
      const elAlt = document.getElementById("tm-alt");
      const elVel = document.getElementById("tm-vel");
      const elSig = document.getElementById("tm-sig");
      tl.fromTo(
        clock,
        { t: 0 },
        {
          t: TOTAL,
          duration: TOTAL,
          ease: "none",
          onUpdate() {
            const t = clock.t;
            const m = Math.floor(t / 60);
            const s = t - m * 60;
            elT.textContent = "T+ " + String(m).padStart(2, "0") + ":" + s.toFixed(2).padStart(5, "0");
            const f = Math.floor(t * 6);
            elAlt.textContent = (412.6 + Math.sin(t * 0.37) * 0.42).toFixed(1);
            elVel.textContent = (7.66 + Math.sin(t * 0.21) * 0.004).toFixed(3);
            elSig.textContent = String(-91 - Math.floor(SQ.hash(f) * 4));
          },
        },
        0,
      );
      tl.fromTo("#hud-progress-fill", { scaleX: 0 }, { scaleX: 1, duration: TOTAL, ease: "none" }, 0);
      tl.fromTo("#hud-dot", { opacity: 1 }, { opacity: 0.25, duration: 0.6, ease: "sine.inOut", repeat: 205, yoyo: true }, 0);

      // Chapter labels: each fades in at its scene and out at the next.
      const CHAPTERS = [
        [1.2, 9.7],
        [13.2, 20.3],
        [20.3, 32.9],
        [32.9, 49.7],
        [49.7, 66.0],
        [66.0, 83.6],
        [83.6, 95.9],
        [95.9, 106.3],
        [106.3, 117.4],
      ];
      CHAPTERS.forEach(([a, b], i) => {
        const el = "#chap-" + i;
        tl.fromTo(el, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, a + 0.15);
        tl.to(el, { opacity: 0, x: 18, duration: 0.3, ease: "power2.in" }, b - 0.3);
      });

      // Film grain: stepped, seeded offsets (24 steps per second).
      const grain = document.getElementById("grain");
      const g = { t: 0 };
      tl.fromTo(
        g,
        { t: 0 },
        {
          t: TOTAL,
          duration: TOTAL,
          ease: "none",
          onUpdate() {
            const f = Math.floor(g.t * 24);
            grain.style.backgroundPosition = Math.floor(SQ.hash(f * 3 + 1) * 512) + "px " + Math.floor(SQ.hash(f * 3 + 2) * 512) + "px";
          },
        },
        0,
      );

      // Cut accents: white flash into the title and the close, a hard glitch-flash into the problem.
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.85, duration: 0.08, ease: "none" }, 10.02);
      tl.to("#flash", { opacity: 0, duration: 0.7, ease: "power2.out" }, 10.1);
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.35, duration: 0.05, ease: "none", immediateRender: false }, 20.27);
      tl.to("#flash", { opacity: 0, duration: 0.25, ease: "power2.out" }, 20.32);
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.7, duration: 0.08, ease: "none", immediateRender: false }, 117.7);
      tl.to("#flash", { opacity: 0, duration: 0.8, ease: "power2.out" }, 117.78);
      tl.fromTo("#fadeout", { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power1.in" }, TOTAL - 1.0);

      window.__timelines["main"] = tl;
    </script>
  </body>
