    <script>
      const TOTAL = 210.7;
      const tl = gsap.timeline({ paused: true });

      // a quiet, seeded star field that drifts very slowly
      const stars = document.getElementById("stars");
      for (let i = 0; i < 160; i++) {
        const s = document.createElement("div");
        s.className = "star";
        const sz = 1 + Math.floor(SQ.hash(i * 7 + 4) * 3);
        s.style.width = s.style.height = sz + "px";
        s.style.left = Math.floor(SQ.hash(i * 7 + 1) * 2000) + "px";
        s.style.top = Math.floor(SQ.hash(i * 7 + 2) * 1160) + "px";
        s.style.opacity = (0.2 + SQ.hash(i * 7 + 3) * 0.55).toFixed(2);
        stars.appendChild(s);
      }
      tl.fromTo("#stars", { x: 0, y: 0 }, { x: -60, y: -20, duration: TOTAL, ease: "none" }, 0);

      // HUD: hidden on the title and closing slides
      tl.fromTo("#hud-in", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 9.6);
      tl.to("#hud-in", { opacity: 0, duration: 0.5, ease: "power2.in" }, 202.3);
      tl.fromTo("#hud-progress-fill", { scaleX: 0 }, { scaleX: 1, duration: TOTAL, ease: "none" }, 0);
      const CH = [[9.5, 27.6], [27.6, 49.6], [49.6, 65.0], [65.0, 93.5], [93.5, 103.6], [103.6, 121.9], [121.9, 134.0], [134.0, 148.7], [148.7, 169.3], [169.3, 182.8], [182.8, 202.7]];
      CH.forEach(([a, b], i) => {
        const el = "#chap-" + (i + 1);
        tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, a + 0.2);
        tl.to(el, { opacity: 0, duration: 0.25, ease: "power2.in" }, b - 0.3);
      });

      const grain = document.getElementById("grain");
      const g = { t: 0 };
      tl.fromTo(
        g,
        { t: 0 },
        {
          t: TOTAL,
          duration: TOTAL,
          ease: "none",
          onUpdate() {
            const f = Math.floor(g.t * 24);
            grain.style.backgroundPosition = Math.floor(SQ.hash(f * 3 + 1) * 512) + "px " + Math.floor(SQ.hash(f * 3 + 2) * 512) + "px";
          },
        },
        0,
      );
      tl.fromTo("#fadeout", { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power1.in" }, TOTAL - 1.0);

      window.__timelines["main"] = tl;
