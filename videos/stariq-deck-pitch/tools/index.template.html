<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>StarIQ — Investor pitch</title>
    <link rel="stylesheet" href="assets/css/brand.css" />
    <link rel="stylesheet" href="assets/css/deck.css" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/js/cues.js"></script>
    <script src="assets/js/fx.js"></script>
    <style>
      @font-face {
        font-family: "Manrope";
        src: url("assets/fonts/manrope-800.woff2") format("woff2");
        font-weight: 800;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #050c1c;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050c1c;
      }
      [data-composition-id="main"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
      #sky {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 80% 70% at 70% 35%, #0f2550 0%, #081631 45%, #050c1c 100%);
      }
      #stars {
        position: absolute;
        inset: -40px;
      }
      .star {
        position: absolute;
        border-radius: 50%;
        background: #dce8ff;
      }
      #hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #hud-in {
        position: absolute;
        inset: 0;
      }
      #hud-brand {
        position: absolute;
        left: 120px;
        top: 52px;
        font-family: "Manrope", sans-serif;
        font-weight: 800;
        font-size: 30px;
        letter-spacing: -0.01em;
        color: #eef4ff;
      }
      #hud-brand span {
        color: #6f9dff;
      }
      #hud-conf {
        position: absolute;
        right: 120px;
        top: 60px;
        font-family: "JetBrains Mono", monospace;
        font-size: 17px;
        letter-spacing: 0.2em;
        color: #8197ba;
      }
      #hud-chapter {
        position: absolute;
        left: 120px;
        bottom: 40px;
        width: 900px;
        height: 28px;
      }
      .chap {
        position: absolute;
        left: 0;
        bottom: 0;
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 19px;
        letter-spacing: 0.24em;
        color: #c8d6ee;
        white-space: nowrap;
        opacity: 0;
      }
      .chap b {
        color: #6f9dff;
        margin-right: 16px;
      }
      #hud-progress {
        position: absolute;
        right: 120px;
        bottom: 50px;
        width: 520px;
        height: 4px;
        border-radius: 4px;
        background: rgba(150, 190, 255, 0.18);
        overflow: hidden;
      }
      #hud-progress-fill {
        width: 100%;
        height: 100%;
        background: #6f9dff;
        transform-origin: 0 50%;
      }
      #grain {
        position: absolute;
        inset: -10%;
        pointer-events: none;
        opacity: 0.045;
        mix-blend-mode: overlay;
        background-image: url("assets/img/grain.png");
        background-size: 512px 512px;
      }
      #fadeout {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: #000;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="{{TOTAL}}">
      <div id="backdrop" class="clip" data-start="0" data-duration="{{TOTAL}}" data-track-index="0" style="position: absolute; inset: 0">
        <div id="sky"></div>
        <div id="stars"></div>
      </div>

{{SLOTS}}

      <div id="hud" class="clip" data-start="0" data-duration="{{TOTAL}}" data-track-index="10">
        <div id="hud-in">
          <div id="hud-brand">Star<span>IQ</span></div>
          <div id="hud-conf">CONFIDENTIAL</div>
          <div id="hud-chapter">
{{CHAPTERS}}
          </div>
          <div id="hud-progress"><div id="hud-progress-fill"></div></div>
        </div>
      </div>
      <div id="finish" class="clip" data-start="0" data-duration="{{TOTAL}}" data-track-index="11" style="position: absolute; inset: 0; pointer-events: none">
        <div id="grain"></div>
        <div id="fadeout"></div>
      </div>

      <audio id="score" src="assets/audio/score.wav" data-start="0" data-duration="{{TOTAL}}" data-track-index="20" data-volume="0.9" data-audio-group="music"></audio>
{{VO}}
{{SFX}}
    </div>

    <script>
      const TOTAL = {{TOTAL}};
      const tl = gsap.timeline({ paused: true });

      // a quiet, seeded star field that drifts very slowly
      const stars = document.getElementById("stars");
      for (let i = 0; i < 160; i++) {
        const s = document.createElement("div");
        s.className = "star";
        const sz = 1 + Math.floor(SQ.hash(i * 7 + 4) * 3);
        s.style.width = s.style.height = sz + "px";
        s.style.left = Math.floor(SQ.hash(i * 7 + 1) * 2000) + "px";
        s.style.top = Math.floor(SQ.hash(i * 7 + 2) * 1160) + "px";
        s.style.opacity = (0.2 + SQ.hash(i * 7 + 3) * 0.55).toFixed(2);
        stars.appendChild(s);
      }
      tl.fromTo("#stars", { x: 0, y: 0 }, { x: -60, y: -20, duration: TOTAL, ease: "none" }, 0);

      // HUD: hidden on the title and closing slides
      tl.fromTo("#hud-in", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 9.6);
      tl.to("#hud-in", { opacity: 0, duration: 0.5, ease: "power2.in" }, 202.3);
      tl.fromTo("#hud-progress-fill", { scaleX: 0 }, { scaleX: 1, duration: TOTAL, ease: "none" }, 0);
      const CH = {{CHAP_WINDOWS}};
      CH.forEach(([a, b], i) => {
        const el = "#chap-" + (i + 1);
        tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, a + 0.2);
        tl.to(el, { opacity: 0, duration: 0.25, ease: "power2.in" }, b - 0.3);
      });

      const grain = document.getElementById("grain");
      const g = { t: 0 };
      tl.fromTo(
        g,
        { t: 0 },
        {
          t: TOTAL,
          duration: TOTAL,
          ease: "none",
          onUpdate() {
            const f = Math.floor(g.t * 24);
            grain.style.backgroundPosition = Math.floor(SQ.hash(f * 3 + 1) * 512) + "px " + Math.floor(SQ.hash(f * 3 + 2) * 512) + "px";
          },
        },
        0,
      );
      tl.fromTo("#fadeout", { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power1.in" }, TOTAL - 1.0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
