<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/css/brand.css" />
      <link rel="stylesheet" href="assets/css/deck.css" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        .d11-tl {
          position: relative;
          height: 370px;
          margin-top: 36px;
        }
        .d11-line {
          position: absolute;
          left: 150px;
          right: 150px;
          top: 120px;
          height: 4px;
          background: rgba(150, 190, 255, 0.3);
          transform-origin: 0 50%;
        }
        .d11-n {
          position: absolute;
          top: 60px;
          width: 340px;
          margin-left: -170px;
          text-align: center;
        }
        .d11-n .dot {
          width: 26px;
          height: 26px;
          border-radius: 50%;
          margin: 47px auto 22px;
          background: #050c1c;
          border: 4px solid #8197ba;
        }
        .d11-n.us .dot {
          background: #6f9dff;
          border-color: #6f9dff;
          box-shadow: 0 0 24px rgba(111, 157, 255, 0.8);
        }
        .d11-n .dt {
          font-family: "Manrope", sans-serif;
          font-weight: 800;
          font-size: 44px;
          color: #eef4ff;
        }
        .d11-n .wh {
          font-family: "Manrope", sans-serif;
          font-size: 30px;
          color: #b9c9e4;
          margin-top: 4px;
        }
        .d11-n.them .dt,
        .d11-n.them .wh {
          color: #8197ba;
        }
        .d11-ahead {
          position: absolute;
          left: 200px;
          width: 560px;
          top: 310px;
          height: 34px;
          border: 4px solid #34d399;
          border-top: 0;
          border-radius: 0 0 14px 14px;
        }
        .d11-ahead span {
          position: absolute;
          left: 50%;
          bottom: -34px;
          transform: translateX(-50%);
          padding: 6px 18px;
          border-radius: 30px;
          background: #34d399;
          color: #04131a;
          font-family: "Manrope", sans-serif;
          font-weight: 800;
          font-size: 26px;
          white-space: nowrap;
        }
        .d11-pills {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 30px;
          margin-top: 52px;
        }
        .d11-p {
          padding: 36px 32px;
          font-family: "Manrope", sans-serif;
          font-weight: 800;
          font-size: 44px;
          color: #eef4ff;
          text-align: center;
        }
      </style>

      <div id="root" data-composition-id="d11-moat" data-width="1920" data-height="1080">
        <div class="slide" id="d11">
          <div class="kicker" id="d11-k" data-text="HOW HARD WILL IT BE TO COPY?">HOW HARD WILL IT BE TO COPY?</div>
          <h1 class="title" id="d11-t">Three years ahead. <span class="accent">The only full stack.</span></h1>
          <div class="d11-tl">
            <div class="d11-line" id="d11-line"></div>
            <div class="d11-n us" id="d11-n1" style="left: 260px"><div class="dot"></div><div class="dt">Mar 2023</div><div class="wh">StarIQ OS on the beam</div></div>
            <div class="d11-n us" id="d11-n2" style="left: 700px"><div class="dot"></div><div class="dt">Mar 2024</div><div class="wh">StarIQ AI on the beam</div></div>
            <div class="d11-n them" id="d11-n3" style="left: 1140px"><div class="dot"></div><div class="dt">Mar 2026</div><div class="wh">NVIDIA Space-1</div></div>
            <div class="d11-n them" id="d11-n4" style="left: 1580px"><div class="dot"></div><div class="dt">Oct 2026</div><div class="wh">Google AI satellite</div></div>
            <div class="d11-ahead" id="d11-ahead"><span>3 years ahead</span></div>
          </div>
          <div class="d11-pills">
            <div class="card d11-p" id="d11-p1">Full stack</div>
            <div class="card d11-p" id="d11-p2">Arm · AMD · RISC-V tested</div>
            <div class="card d11-p" id="d11-p3">European IP</div>
          </div>
        </div>
        <div class="foot" id="d11-f">INDEPENDENT OF UNIVERSITY RESEARCH · NO-OBJECTION CERTIFICATE · PATENTS FILED</div>
      </div>

      <script>
        (function () {
          const T0 = 169.3;
          const DUR = 13.5;
          const tl = gsap.timeline({ paused: true });
          const at = SQ.local(T0);
          const q = (s) => document.querySelector(s);

          SQ.sceneFade(tl, "#d11", DUR);
          SQ.scramble(tl, q("#d11-k"), 0.05, 0.6, 1101);
          SQ.titleIn(tl, q("#d11-t"), at("n22", 0) - 0.1);
          tl.fromTo("#d11-line", { scaleX: 0 }, { scaleX: 1, duration: 4.5, ease: "power1.inOut" }, at("n22", 1) - 0.3);
          SQ.rise(tl, "#d11-n1", at("n22", 1) + 0.4, { y: 20 });
          SQ.rise(tl, "#d11-n2", at("n22", 2) - 0.1, { y: 20 });
          SQ.rise(tl, ["#d11-n3", "#d11-n4"], at("n22", 2) + 1.0, { y: 20, stagger: 0.4 });
          tl.fromTo("#d11-ahead", { opacity: 0, scaleX: 0.3 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: "back.out(1.8)" }, at("n22", 2) + 1.6);
          SQ.rise(tl, "#d11-p1", at("n22", 3) - 0.1, { y: 24 });
          SQ.rise(tl, "#d11-p2", at("n22", 4) - 0.1, { y: 24 });
          SQ.rise(tl, "#d11-p3", at("n22", 6) - 0.1, { y: 24 });
          SQ.rise(tl, "#d11-f", at("n22", 3), { y: 0 });
          tl.to("#d11-f", { opacity: 0, duration: 0.35 }, DUR - 0.35);

          window.__timelines["d11-moat"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
