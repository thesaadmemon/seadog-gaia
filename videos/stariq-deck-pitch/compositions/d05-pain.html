<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/css/brand.css" />
      <link rel="stylesheet" href="assets/css/deck.css" />
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        .d05-two {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 40px;
          margin-top: 14px;
        }
        .d05-c {
          padding: 30px 30px 32px;
          display: grid;
          grid-template-columns: 380px 1fr;
          gap: 30px;
          align-items: center;
        }
        .d05-ph {
          width: 380px;
          height: 380px;
        }
        .d05-txt {
          display: flex;
          flex-direction: column;
          gap: 14px;
          align-items: flex-start;
        }
        .d05-txt .num {
          font-size: 84px;
          white-space: nowrap;
        }
        .d05-txt .label {
          font-size: 30px;
          color: #eef4ff;
        }
        .d05-txt .src {
          font-family: "JetBrains Mono", monospace;
          font-size: 17px;
          letter-spacing: 0.06em;
          color: #8197ba;
          line-height: 1.5;
        }
        .d05-banner {
          margin-top: 36px;
          justify-content: center;
          font-size: 42px;
        }
      </style>

      <div id="root" data-composition-id="d05-pain" data-width="1920" data-height="1080">
        <div class="slide" id="d05">
          <div class="kicker" id="d05-k" data-text="IS THE PAIN REAL?">IS THE PAIN REAL?</div>
          <h1 class="title" id="d05-t">Same planet. Same radiation. <span class="accent">Two chips.</span></h1>
          <div class="d05-two">
            <div class="card d05-c" id="d05-a">
              <div class="photo d05-ph"><img src="assets/img/perseverance.jpg" alt="NASA Perseverance rover" /></div>
              <div class="d05-txt">
                <span class="tag red">SPACE-GRADE</span>
                <div class="num red" id="d05-na">$300k</div>
                <div class="label" id="d05-la">200 MHz · too slow for modern AI</div>
                <div class="src">BAE RAD750 · PERSEVERANCE, 2020</div>
              </div>
            </div>
            <div class="card d05-c" id="d05-b">
              <div class="photo d05-ph"><img src="assets/img/ingenuity.jpg" alt="NASA Ingenuity helicopter" /></div>
              <div class="d05-txt">
                <span class="tag green">COMMERCIAL, PROTECTED</span>
                <div class="num green" id="d05-nb">0 flights</div>
                <div class="label" id="d05-lb">planned for 5 · 100× the compute</div>
                <div class="src">ARM-BASED SOC ON LINUX · INGENUITY, 2021–2024</div>
              </div>
            </div>
          </div>
          <div class="banner d05-banner" id="d05-ban"><div>The difference is not the chip. <span class="accent">It is the protection around it.</span></div></div>
        </div>
        <div class="foot" id="d05-f">SOURCES: HEISE 2021 · IEEE SPECTRUM 2021 · AIP 2024</div>
      </div>

      <script>
        (function () {
          const T0 = 65.0;
          const DUR = 28.5;
          const tl = gsap.timeline({ paused: true });
          const at = SQ.local(T0);
          const q = (s) => document.querySelector(s);

          SQ.sceneFade(tl, "#d05", DUR);
          SQ.scramble(tl, q("#d05-k"), 0.1, 0.6, 501);
          SQ.titleIn(tl, q("#d05-t"), at("n11", 0));
          // space-grade: price lands on "three hundred thousand dollars", clock on "two hundred megahertz"
          SQ.rise(tl, "#d05-a", at("n12", 0) - 0.15);
          tl.fromTo("#d05-a img", { scale: 1.1 }, { scale: 1.0, duration: 12, ease: "none" }, at("n12", 0));
          SQ.rise(tl, "#d05-na", at("n12", 2), { y: 20 });
          SQ.rise(tl, "#d05-la", at("n12", 3), { y: 16 });
          // commercial, protected: the flight count climbs on "it flew seventy-two"
          SQ.rise(tl, "#d05-b", at("n13", 0) - 0.15);
          tl.fromTo("#d05-b img", { scale: 1.1 }, { scale: 1.0, duration: 12, ease: "none" }, at("n13", 0));
          SQ.rise(tl, "#d05-lb", at("n13", 1), { y: 16 });
          SQ.rise(tl, "#d05-nb", at("n13", 5), { y: 20 });
          SQ.count(tl, q("#d05-nb"), 5, 72, at("n13", 6) - 0.2, 1.3, (v) => Math.round(v) + " flights", "power2.out");
          SQ.rise(tl, "#d05-ban", at("n14", 0) - 0.1, { y: 24 });
          SQ.rise(tl, "#d05-f", at("n12", 0), { y: 0 });
          tl.to("#d05-f", { opacity: 0, duration: 0.35 }, DUR - 0.35);

          window.__timelines["d05-pain"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
